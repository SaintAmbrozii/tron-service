server:
  port: 8090
  shutdown: graceful
  tomcat:
    connection-timeout: 3s
    keep-alive-timeout: 20s
spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    username: userbek
    password: passwordbek
    url: jdbc:postgresql://localhost:6432/tr_db
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 12
  sql:
    init:
      mode: always # Запускать скрипт при каждом старте
      schema-locations: classpath:db/migration/V1__create_table.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration

external:
  zipkin-endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
      produce: b3
      consume: b3
    export:
      enabled: true
      zipkin:
        endpoint: ${external.zipkin-endpoint}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        all: true