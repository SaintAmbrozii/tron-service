server:
  port: 8070
  shutdown: graceful
  tomcat:
    connection-timeout: 3s
    keep-alive-timeout: 20s
spring:
  application:
    name: wallet-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:6432/tr_db
    username: userbek
    password: passwordbek
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 12
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__create_table.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
  kafka:
    bootstrap-servers: localhost:9092
    client-id: wallet-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: http://localhost:8081
        enable.idempotence: true
    consumer:
      group-id: ${wallet-service-group-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        avro.use.logical.type.converters: true
        schema.registry.url: http://localhost:8081
      auto-offset-reset: earliest
      enable-auto-commit: false
      listener:
        ack-mode: manual


kafka-properties:
  topics:
    banking-topic:
      name: outbox_banking_event_v1
      replication-count: 1
      partitions-count: 3
      timeout-on-produce: 5s
  consumers:
    wallet-group:
      topic: banking_notification_event_v1
      ack-mode: MANUAL # Incident Service accepts values: MANUAL, MANUAL_IMMEDIATE, BATCH
      concurrency: 1
      group-id: banking-service-group-v2
      nack-duration: 500ms
  backoff:
    interval: 5s
    max-attempts: 5


logging:
  level:
    org.flywaydb.core: DEBUG
    org.springframework.boot.autoconfigure.flyway: INFO
    org.springframework.kafka: DEBUG
    org.apache.kafka: WARN


tron:
  private-key: "4a6213c5c05dd3dc8793837dde88b74bd9a45b1b9dc7663f21b771bdd56ad50b"
  owner: "TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM"

banking-client:
  nearest-path: "/api/v1/banking/toSbp"
  config:
    root-uri: http://localhost:8070
    max-connections: 10
    max-connections-per-route: 10
    inactivity-seconds: 10
    read-timeout: 5s
    connect-timeout: 2s
    connection-request-timeout: 1s
    buffering-client-http-request-factory: true
    key-store-bundle-name: ""
    trust-store-bundle-name: ""
    ssl-mode: NONE
usd-client:
  nearest-path: "/api/v1/usd/course"
  config:
    root-uri: http://localhost:8040
    max-connections: 10
    max-connections-per-route: 10
    inactivity-seconds: 10
    read-timeout: 5s
    connect-timeout: 2s
    connection-request-timeout: 1s
    buffering-client-http-request-factory: true
    key-store-bundle-name: ""
    trust-store-bundle-name: ""
    ssl-mode: NONE


resilience4j:
  circuitbreaker:
    metrics:
      enabled: true
    configs:
      default:
        sliding-window-type: time_based
        sliding-window-size: 30
        permitted-number-of-calls-in-half-open-state: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state:
          seconds: 10
        slow-call-duration-threshold:
          seconds: 4
        minimum-number-of-calls: 15
    instances:
      volunteerBackend:
        base-config: default
      trackingBackend:
        base-config: default
  retry:
    metrics:
      enabled: true
    configs:
      default:
        max-attempts: 5
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.75
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - com.example.walletservice.exception.RestClientNonRetryableException
        retry-exceptions:
          - com.example.walletservice.exception.RestClientRetryableException
    instances:
      usdBackend:
        base-config: default
      bankingBackend:
        base-config: default

external:
  zipkin-endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
      produce: b3
      consume: b3
    export:
      zipkin:
        endpoint: ${external.zipkin-endpoint}
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        all: true